name: Refresh profile cards

on:
  schedule:
    # 04:23 UTC = 10:23 Asia/Dhaka. Off the hour to avoid the busy cron window.
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "generate_cards.py"
      - "assets/me.png"
      - "fonts/**"
      - "requirements.txt"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch real contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render cards and validate
        run: python generate_cards.py

      - name: Commit only when something changed
        run: |
          if [ -z "$(git status --porcelain -- data cards README.md)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          git commit -m "chore(profile): refresh contribution cards [skip ci]"
          git push
